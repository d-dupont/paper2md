[project]
name = "paper2md"
version = "0.3.1"
description = "Convert academic PDFs into Claude-friendly Markdown, figures and tables"
readme = "README.md"
authors = [
    { name = "David Dupont", email = "dupont@post.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pdf", "markdown", "arxiv", "academic-papers", "docling", "claude", "llm"]
dependencies = [
    "docling>=2.137.0",
    "pandas>=3.0.6",
    "pypdfium2>=5.14.0",
]

[project.urls]
Repository = "https://github.com/d-dupont/paper2md"

[project.scripts]
paper2md = "paper2md.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs the real conversion on a sample paper (seconds to minutes); skip with -m 'not slow'",
]
