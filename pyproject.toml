[project]
name = "paper2md"
version = "0.1.0"
description = "Convert academic PDFs into Claude-friendly Markdown, figures and tables"
readme = "README.md"
authors = [
    { name = "David Dupont", email = "dupont@post.com" }
]
requires-python = ">=3.11"
dependencies = [
    "docling>=2.137.0",
]

[project.scripts]
paper2md = "paper2md.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
